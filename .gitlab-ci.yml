stages:
  - commit
  - integration
  - acceptance

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "development"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "claude"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "claude"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

# Configure these as masked/protected CI/CD variables in GitLab project settings:
# PROPERTIES_ENCRYPTION_KEY, REPOSITORY_USER, REPOSITORY_PASSWORD, DOCKER_USER, DOCKER_PASSWORD, GITLAB_TOKEN

default:
  interruptible: true

validate-env-vars:
  stage: commit
  image: alpine:latest
  script:
    - |
      REQUIRED_VARS="PROPERTIES_ENCRYPTION_KEY REPOSITORY_USER REPOSITORY_PASSWORD DOCKER_USER DOCKER_PASSWORD GITLAB_TOKEN"
      MISSING_VARS=""
      for var in $REQUIRED_VARS; do
        # Presence-only check: verifies variable is defined without expanding/logging its value.
        if ! eval '[ "${'"$var"'+x}" = x ]'; then
          MISSING_VARS="$MISSING_VARS $var"
        fi
      done
      if [ -n "$MISSING_VARS" ]; then
        echo "ERROR: The following required CI/CD variables are not set:$MISSING_VARS"
        if [ "$CI_COMMIT_REF_PROTECTED" != "true" ]; then
          echo "HINT: Protected variables are not exposed to unprotected refs."
          echo "      Protect the ref or unprotect these variables for this pipeline."
        fi
        echo "HINT: If these variables are environment-scoped, use scope '*' or a scope matching this job environment."
        exit 1
      fi
      echo "All required environment variables are set"

typescript-commit-stage:
  stage: commit
  needs:
    - job: validate-env-vars
  rules:
    - when: never
  image: node:20.5.1
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache/
      - .pnp.cjs
      - .pnp.loader.mjs
      - "**/node_modules/"
    policy: pull-push
  variables:
    NODE_AUTH_TOKEN: "$CI_JOB_TOKEN"
  script:
    - corepack enable
    - yarn install --dev --frozen-lockfile
    - yarn run local-registry-install
    - |
      yarn run local-registry-start > server.log 2>&1 &
      PROCESS_ID=$!
      trap 'if [ -n "$PROCESS_ID" ]; then kill "$PROCESS_ID" || true; fi' EXIT
    - yarn config set registry "http://localhost:4873"
    - npx -y npm-cli-adduser -u "$REPOSITORY_USER" -p "$REPOSITORY_PASSWORD" -e support@sayin.app -r http://localhost:4873
    - yarn run test

java-commit-stage:
  stage: commit
  needs:
    - job: validate-env-vars
  image: amazoncorretto:22
  cache:
    key:
      files:
        - build.gradle
        - settings.gradle
    paths:
      - .gradle/
      - build-cache/
      - .gradle/caches/
      - .gradle/wrapper/
    policy: pull-push
  script:
    - yum install -y findutils
    - chmod a+x gradlew
    - ./gradlew build
  artifacts:
    when: always
    reports:
      junit:
        - "**/.build/test-results/test/TEST-*.xml"

java-integration-stage:
  stage: integration
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: java-commit-stage
  script:
    - echo "$GITLAB_TOKEN" | docker login registry.gitlab.com -u oauth2 --password-stdin
    - docker pull registry.gitlab.com/guitar-center/gl_merchandising-technology/applicationsystems/strata/strata.frontendcontroller/strata-frontendcontroller-testsuite:latest
    - docker run registry.gitlab.com/guitar-center/gl_merchandising-technology/applicationsystems/strata/strata.frontendcontroller/strata-frontendcontroller-testsuite:latest --package=strata.frontendcontroller --tags=IntegrationStage

java-acceptance-stage:
  stage: acceptance
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: java-integration-stage
  script:
    - echo "$GITLAB_TOKEN" | docker login registry.gitlab.com -u oauth2 --password-stdin
    - docker pull registry.gitlab.com/guitar-center/gl_merchandising-technology/applicationsystems/strata/microservices/strata.frontendcontroller/strata-frontendcontroller-testsuite:latest
    - docker run registry.gitlab.com/guitar-center/gl_merchandising-technology/applicationsystems/strata/microservices/strata.frontendcontroller/strata-frontendcontroller-testsuite:latest --package=strata.frontendcontroller --tags=AcceptanceStage
