name: Development-Pipeline
on:
  push:
    branches: [ development, main, claude ]
  pull_request:
    branches: [ development, main, claude ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PROPERTIES_ENCRYPTION_KEY: ${{secrets.PROPERTIES_ENCRYPTION_KEY}}
  REPOSITORY_USER: ${{vars.REPOSITORY_USER}}
  REPOSITORY_PASSWORD: ${{secrets.REPOSITORY_PASSWORD}}
  DOCKER_USER: ${{vars.DOCKER_USER}}
  DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}

jobs:
  typescript-commit-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.5.1'
          registry-url: 'https://registry.npmjs.org/'
          always-auth: 'true'

      - name: Cache Node Modules
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
            .yarn/cache
            .pnp.*
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dev dependencies with Yarn
        run: yarn install --dev --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Install Verdaccio
        run: yarn run local-registry-install
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Start Verdaccio
        run: |
          nohup yarn run local-registry-start > server.log 2>&1 &
          echo "PROCESS_ID=$!" > $GITHUB_ENV
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Set Registry for Yarn
        run: yarn config set registry "http://localhost:4873"

      - name: Add User to Verdaccio
        run: |
          npx -y npm-cli-adduser -u ${{vars.REPOSITORY_USER}} -p ${{secrets.REPOSITORY_PASSWORD}} -e support@sayin.app -r http://localhost:4873

      - name: Build Typescript with Yarn
        run: yarn run test

      - name: Stop Verdaccio
        if: always()
        run: |
          if [[ -n "${{ env.PROCESS_ID }}" ]]; then
            kill ${{ env.PROCESS_ID }} || true
            echo "Process ${{ env.PROCESS_ID }} stopped"
          fi

  java-commit-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Chmod GradleW
        run: chmod a+x gradlew

      - name: Build Java with Gradle
        run: ./gradlew build

      - name: Publish Test Report (Commit Stage)
        uses: mikepenz/action-junit-report@v3
        if: success() || failure()
        with:
            report_paths: '**/.build/test-results/test/TEST-*.xml'

  java-integration-stage:
    runs-on: ubuntu-latest
    needs: java-commit-stage
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{vars.REPOSITORY_USER}}
          password: ${{secrets.REPOSITORY_PASSWORD}}

      - name: Pull Strata.FrontEndController.TestSuite Image
        run: docker pull ghcr.io/strata/strata-frontendcontroller-testsuite:1.0-SNAPSHOT

      - name: Run Strata.FrontEndController.TestSuite Integration Tests
        run: |
          docker run ghcr.io/strata/strata-frontendcontroller-testsuite:1.0-SNAPSHOT \
            --package=strata.frontendcontroller --tags=IntegrationStage

  java-acceptance-stage:
    runs-on: ubuntu-latest
    needs: java-integration-stage
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{vars.REPOSITORY_USER}}
          password: ${{secrets.REPOSITORY_PASSWORD}}

      - name: Pull Strata.FrontEndController.TestSuite Image
        run: docker pull ghcr.io/strata/strata-frontendcontroller-testsuite:1.0-SNAPSHOT

      - name: Run Strata.FrontEndController.TestSuite Acceptance Tests
        run: |
          docker run ghcr.io/strata/strata-frontendcontroller-testsuite:1.0-SNAPSHOT \
            --package=strata.frontendcontroller --tags=AcceptanceStage



