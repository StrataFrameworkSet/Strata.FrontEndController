wrapper.jarFile = ".gradle/wrapper/gradle-wrapper.jar"

ext {
    strata_foundation_version = "1.0.0"
    strata_server_version = "1.0.0"
    strata_client_version = "1.0.0"

    spring_version = "6.2.2"
    springboot_version = "3.4.1"
    spring_security_version = "6.2.1"
    hibernate_version = "6.4.4.Final"

    postgresql_version = "42.7.3"
    h2_version = "2.1.214"
    modelmapper_version = "3.2.0"

    junit_jupiter_version = "5.13.3"
    junit_platform_version = "1.13.3"

    major = "1"
    minor = ".1"
    patch = ".0-SNAPSHOT"
}

group 'strata.frontendcontroller'
version "$major$minor$patch"
layout.buildDirectory.set(layout.projectDirectory.dir(".build"))

subprojects {
    group 'strata.frontendcontroller'
    version "$major$minor$patch"
    layout.buildDirectory.set(layout.projectDirectory.dir(".build"))
}



