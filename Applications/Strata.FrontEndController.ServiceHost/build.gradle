plugins {
    id 'java'
    id "com.google.cloud.tools.jib" version "3.5.4"
}

sourceSets {
    main.java.srcDirs = ['src/main/java','.build/generated-java']
    main.resources.srcDirs = ['src/main/resources','src/main/schema']
    test.java.srcDirs = ['src/unused']
    test.resources.srcDirs = ['src/unused']
}

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

dependencies {
    implementation project(":Components:Strata.FrontEndController.Server")
}

jib {
    from {
        image = "amazoncorretto:23-alpine"
        auth {
            username = "$System.env.DOCKER_USER"
            password = "$System.env.DOCKER_PASSWORD"
        }
    }
    to {
        image = "ghcr.io/johnliebenau/strata/strata-frontendcontroller-servicehost"
        auth {
            username = "$System.env.REPOSITORY_USER"
            password = "$System.env.REPOSITORY_PASSWORD"
        }
    }
    container {
        environment = [DEPLOY_ENV:"development"]
        jvmFlags = ["-Xmx1024m"]
        extraClasspath = [".build/libs/Strata.FrontEndController.ServiceHost-${version}.jar"]
        mainClass = "strata.frontendcontroller.servicehost.main.FrontEndControllerServiceHost"
        ports = ['8081']
        format = 'OCI'
    }
}

apply from: rootProject.file('gradle/strata-image.gradle')

tasks.named('build') {
    finalizedBy('jib')
}
